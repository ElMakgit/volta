[package]
name = "volta"
version = "0.5.0"
edition = "2024"
description = "Offline breadboard, Arduino sketch and checks from a task sentence"
license = "MIT"
repository = "https://github.com/ElMakgit/volta"
readme = "README.md"
authors = ["ElMak <89011639+ElMakgit@users.noreply.github.com>"]

[features]
# Exact task texts are shipped with the source. The feature can be turned off
# for a minimal build that recognises only topics and keywords.
default = ["book-tasks"]
book-tasks = []

[dependencies]
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ab_glyph = "0.2"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard"] }
serde_json = "1"
