name: build

# Release archives for Linux/Ubuntu and Windows. A tag such as v0.5.0 builds
# both and attaches them to a GitHub release; a manual run only keeps the
# archives as workflow artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Tests and clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy
          rustup default stable
          rustc --version
          cargo clippy --version

      - name: Tests
        # The book-corpus ratchets are `#[ignore]` for local speed; CI runs
        # everything, including them.
        run: cargo test --locked -- --include-ignored

      - name: Clippy
        run: cargo clippy --locked --all-targets

  linux:
    name: Linux x86_64
    # The oldest supported Ubuntu runner keeps the glibc requirement low, so
    # the archive also starts on newer Ubuntu releases and other distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          stage=$(mktemp -d)
          root="$stage/volta-$version-linux"
          mkdir -p "$root" dist
          install -m 755 target/release/volta "$root/volta"
          install -m 644 README.md LICENSE "$root/"
          install -m 644 pkgbuild/volta.desktop pkgbuild/volta.svg "$root/"
          printf '%s\n' \
            "volta $version" \
            "" \
            "Распакуйте архив и запустите ./volta." \
            "" \
            "Ярлык в меню приложений:" \
            "  install -Dm644 volta.desktop ~/.local/share/applications/volta.desktop" \
            "  install -Dm644 volta.svg ~/.local/share/icons/hicolor/scalable/apps/volta.svg" \
            "  update-desktop-database ~/.local/share/applications 2>/dev/null || true" \
            "" \
            "Схема, скетч и проверки работают офлайн. Подробности — в README.md." \
            > "$root/КАК_ЗАПУСТИТЬ.txt"
          tar -C "$stage" -czf dist/volta-linux-x86_64.tar.gz "volta-$version-linux"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/volta-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item docs/windows.md dist/README-windows.md
          Copy-Item LICENSE dist/LICENSE
          Copy-Item target/release/volta.exe dist/volta.exe
          Compress-Archive -Path dist/volta.exe, dist/README-windows.md, dist/LICENSE `
            -DestinationPath dist/volta-windows-x86_64.zip -Force
          Remove-Item dist/volta.exe, dist/README-windows.md, dist/LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/volta-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and notes
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum volta-*.tar.gz volta-*.zip > SHA256SUMS
          cd ..
          awk -v heading="## $version" '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            printf 'volta %s\n' "$version" > release-notes.md
          fi
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "volta ${tag#v}" \
              --notes-file release-notes.md
          fi
